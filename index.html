<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Eligibility – ID3</title>
<style>
  :root { --bg:#f3f5f9; --card:#fff; --ink:#1d2433; --muted:#6b7488; --brand:#2f5bea; --ok:#14804a; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:22px 16px; text-align:center; }
  header h1 { margin:0 0 4px; font-size:1.5rem; }
  header p { margin:0; opacity:.85; font-size:.95rem; }
  main { max-width:900px; margin:24px auto; padding:0 16px; display:grid; gap:20px; grid-template-columns:1fr 1fr; }
  @media (max-width:760px){ main{ grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:12px; padding:22px; box-shadow:0 2px 10px rgba(20,30,60,.08); }
  .card.full { grid-column:1/-1; }
  h2 { margin-top:0; font-size:1.15rem; }
  label { display:block; margin:14px 0 6px; font-weight:600; font-size:.9rem; }
  select, button { width:100%; padding:11px; font-size:1rem; border-radius:8px; border:1px solid #cfd5e2; background:#fff; }
  button { background:var(--brand); color:#fff; border:none; margin-top:20px; cursor:pointer; font-weight:600; }
  button:hover { filter:brightness(1.08); }
  #result { margin-top:18px; padding:16px; border-radius:10px; text-align:center; font-size:1.3rem; font-weight:700; display:none; }
  #result.ok { background:#e5f6ed; color:var(--ok); }
  #result.bad { background:#fdeaea; color:var(--bad); }
  #path { margin-top:10px; font-size:.88rem; color:var(--muted); text-align:center; }
  ul.tree, ul.tree ul { list-style:none; margin:4px 0 4px 14px; padding-left:14px; border-left:2px solid #dfe4ef; }
  ul.tree { margin-left:0; padding-left:0; border:none; }
  .feat { font-weight:700; color:var(--brand); }
  .edge { color:var(--muted); }
  .yes { color:var(--ok); font-weight:700; }
  .no { color:var(--bad); font-weight:700; }
  .gains span { display:inline-block; background:#eef2ff; border-radius:20px; padding:4px 12px; margin:4px 6px 0 0; font-size:.85rem; }
  small { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Loan Eligibility Classification Using ID3</h1>
  <p>Fill in the application — a Python (Flask) server runs the ID3 decision tree.</p>
</header>

<main>
  <section class="card">
    <h2>Loan Application</h2>
    <form id="form">
      <label for="Income">Income Category</label>
      <select id="Income" name="Income">
        {% for o in options.Income %}<option>{{ o }}</option>{% endfor %}
      </select>

      <label for="Employment">Employment</label>
      <select id="Employment" name="Employment">
        {% for o in options.Employment %}<option>{{ o }}</option>{% endfor %}
      </select>

      <label for="CreditHistory">Credit History</label>
      <select id="CreditHistory" name="CreditHistory">
        {% for o in options.CreditHistory %}<option>{{ o }}</option>{% endfor %}
      </select>

      <button type="submit">Check Eligibility</button>
    </form>
    <div id="result"></div>
    <div id="path"></div>
  </section>

  <section class="card">
    <h2>Learned Decision Tree</h2>
    <div class="gains" id="gains"></div>
    <div id="tree" style="margin-top:12px"><small>Loading…</small></div>
  </section>
</main>

<script>
const form = document.getElementById('form');
const resultBox = document.getElementById('result');
const pathBox = document.getElementById('path');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(form));
  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    resultBox.style.display = 'block';
    resultBox.className = data.eligible ? 'ok' : 'bad';
    resultBox.textContent = (data.eligible ? '✅ ' : '❌ ') + data.result;
    pathBox.textContent = 'Decision path: ' + data.path.join('  →  ');
  } catch (err) {
    resultBox.style.display = 'block';
    resultBox.className = 'bad';
    resultBox.textContent = err.message;
    pathBox.textContent = '';
  }
});

function renderNode(node) {
  if (node.leaf) {
    const cls = node.leaf === 'Yes' ? 'yes' : 'no';
    return `<span class="${cls}">${node.leaf === 'Yes' ? 'Eligible' : 'Not Eligible'}</span> <small>(${node.samples})</small>`;
  }
  let html = `<span class="feat">${node.feature}?</span> <small>gain ${node.gain}</small><ul>`;
  for (const [val, child] of Object.entries(node.children)) {
    html += `<li><span class="edge">${val} →</span> ${renderNode(child)}</li>`;
  }
  return html + '</ul>';
}

fetch('/tree').then(r => r.json()).then(d => {
  document.getElementById('tree').innerHTML = `<ul class="tree"><li>${renderNode(d.tree)}</li></ul>`;
  document.getElementById('gains').innerHTML =
    `<small>Root information gain (${d.training_rows} training rows):</small><br>` +
    Object.entries(d.gains).map(([f, g]) => `<span>${f}: ${g}</span>`).join('');
});
</script>
</body>
</html>
